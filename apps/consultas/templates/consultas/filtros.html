<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="shortcut icon" href="/img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    .nav-link:hover { transform: scale(1.1); transition: transform 0.3s linear; }
    @media (min-width: 992px) {
      .navbar .container-fluid { position: relative; display: flex; align-items: center; }
      .navbar .container-fluid .navbar-collapse {
        position: absolute; left: 50%; transform: translateX(-50%);
        flex-grow: 0; width: max-content;
      }
      .navbar-right-extra { margin-left: auto; display: flex; align-items: center; gap: 16px; padding-left: 24px; }
    }
  </style>
</head>
<body class="bg-light">
    {% include "core/_nav.html" %}

  <div class="container py-4">
    <h1 class="h3 mb-4">KPIs / Indicadores / Incidencias</h1>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/tabla" class="card shadow-sm p-4">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tramo</label>
          <select class="form-select" name="tramo" id="tramo-select">
            <option value="">Selecciona tramo</option>
            {% for t in tramos %}
              <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Vía</label>
          <select class="form-select" name="via" id="via-select">
            <option value="">Selecciona vía</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">KM Inicio</label>
          <input class="form-control" name="pto_km_ini" type="number" step="0.001">
        </div>
        <div class="col-md-2">
          <label class="form-label">KM Fin</label>
          <input class="form-control" name="pto_km_fin" type="number" step="0.001">
        </div>

        <div class="col-md-3">
          <label class="form-label">Fecha Inicio</label>
          <input class="form-control" name="fecha_inicio" type="date">
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha Fin</label>
          <input class="form-control" name="fecha_fin" type="date">
        </div>
        <div class="col-md-3">
          <label class="form-label">Coordenada GPS</label>
          <input class="form-control" name="coordenada_gps" placeholder="lat,lon">
        </div>
        <div class="col-md-3">
          <label class="form-label">Radio (km)</label>
          <input class="form-control" name="radio" type="number" step="0.1">
        </div>
      </div>

      <hr class="my-4">

      <div class="row g-3">
        <div class="col-md-4">
          <h6>KPIs</h6>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="kpigs" value="Ind_KPIG1" id="k1"><label class="form-check-label" for="k1">KPIG1</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="kpigs" value="Ind_KPIG2" id="k2"><label class="form-check-label" for="k2">KPIG2</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="kpigs" value="Ind_KPIG3" id="k3"><label class="form-check-label" for="k3">KPIG3</label></div>
        </div>
        <div class="col-md-4">
          <h6>Incidencias</h6>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="incidencias" value="INC_CEN" id="i1"><label class="form-check-label" for="i1">Centro</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="incidencias" value="INC_LIN" id="i2"><label class="form-check-label" for="i2">Línea</label></div>
        </div>
        <div class="col-md-4">
          <h6>Indicadores operativa</h6>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="indicadores" value="inspecciones" id="o1"><label class="form-check-label" for="o1">Inspecciones</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="indicadores" value="formularios" id="o2"><label class="form-check-label" for="o2">Formularios</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="indicadores" value="km" id="o3"><label class="form-check-label" for="o3">Km</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="indicadores" value="errores" id="o4"><label class="form-check-label" for="o4">Errores</label></div>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Ejecutar</button>
        <a class="btn btn-outline-secondary" href="/kpi-kgi">Volver</a>
      </div>
    </form>
  </div>

  <script>
    const tramoSelect = document.getElementById('tramo-select');
    const viaSelect = document.getElementById('via-select');
    tramoSelect?.addEventListener('change', async () => {
      const tramo = tramoSelect.value;
      viaSelect.innerHTML = '<option value="">Selecciona vía</option>';
      if (!tramo) return;
      const res = await fetch(`/obtener_vias?tramo=${encodeURIComponent(tramo)}`);
      const data = await res.json();
      (data.vias || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        viaSelect.appendChild(opt);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
