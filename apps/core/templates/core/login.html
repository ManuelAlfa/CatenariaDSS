<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="shortcut icon" href="/img/logo.png" type="image/x-icon">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-primary">
    <div class="container-fluid flex-wrap">
      <a class="navbar-brand text-white" href="/entrada">
        <img src="/img/logo.png" alt="logo" width="80" height="40">
      </a>
      <div class="me-auto"></div>
      <div class="d-flex align-items-center gap-2 ms-lg-2">
        <img src="/img/solutia.png" alt="solutia" style="height:40px;width:auto;">
      </div>
    </div>
  </nav>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row justify-content-center w-100">
      <div class="col-md-6 col-lg-4">
        <div class="card border-0 rounded shadow-sm">
          <div class="card-body">
            <h1 class="text-center text-primary mb-4">Identificación del usuario</h1>
            <div class="text-center mb-4">
              <img src="/img/logo.png" alt="logo" class="img-fluid" style="max-width: 220px;">
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login">
              {% csrf_token %}
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <div class="mb-3 text-end">
                <button type="button" class="btn btn-link small p-0" data-bs-toggle="modal" data-bs-target="#restablecerWarningModal">
                  Restablecer contraseña
                </button>
              </div>
              <button type="submit" class="btn btn-primary w-100">Validar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="restablecerWarningModal" tabindex="-1" aria-labelledby="restablecerWarningModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="restablecerWarningModalLabel">Advertencia</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          Debes iniciar sesión para cambiar la contraseña. Al validarte, te llevaremos automáticamente al formulario de cambio.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <a href="/restablecer-password" class="btn btn-primary">Continuar</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
