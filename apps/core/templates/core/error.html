<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="shortcut icon" href="/img/logo.png" type="image/x-icon">
</head>
<body class="bg-light">
    {% include "core/_nav.html" %}

  <div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 90px);">
    <div class="card border-0 shadow-sm" style="max-width: 640px; width: 100%;">
      <div class="card-body p-4 p-md-5 text-center">
        <h1 class="display-6 text-primary mb-3">{{ title }}</h1>
        <p class="lead mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Volver</a>
          <a href="/" class="btn btn-primary">Ir al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
